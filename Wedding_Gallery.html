<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <title>Wedding Gallery</title>
    <link rel="stylesheet" href="assets/gallery.css">
    <script>
        /*__GALLERY_CONFIG__*/
    </script>
    <script defer src="assets/gallery.js"></script>
</head>

<body>
    <section class="gate" id="expiredGate" hidden>
        <div class="gate-box">
            <span class="gate-mark">Expired</span>
            <h1>Gallery unavailable</h1>
            <p>This gallery has passed its expiry date.</p>
        </div>
    </section>

    <section class="gate" id="passwordGate" hidden>
        <form class="gate-box" id="passwordForm">
            <span class="gate-mark">Private Gallery</span>
            <h1 id="gateClientName">Wedding Gallery</h1>
            <label>
                <span>Password</span>
                <input id="passwordInput" type="password" autocomplete="current-password" autofocus>
            </label>
            <button type="submit">Open Gallery</button>
            <p class="gate-error" id="passwordError" hidden>Incorrect password</p>
        </form>
    </section>

    <main class="gallery-app" id="galleryApp" hidden>
        <header class="gallery-header">
            <div class="studio-brand">
                <img id="studioLogo" alt="" hidden>
                <div>
                    <span id="studioName">Wedding Studio</span>
                    <h1 id="clientName">Wedding Gallery</h1>
                    <p id="contactDetails"></p>
                </div>
            </div>
        </header>

        <section class="toolbar" aria-label="Gallery controls">
            <div class="search-wrap">
                <input id="searchInput" type="search" placeholder="Search filename" autocomplete="off">
            </div>

            <div class="segmented" role="group" aria-label="Filter photos">
                <button class="active" id="showAllButton" type="button">All</button>
                <button id="showSelectedButton" type="button">Selected</button>
            </div>
        </section>

        <nav class="group-nav" id="groupNav" aria-label="Camera sections"></nav>

        <section class="grid-status" id="gridStatus" aria-live="polite"></section>
        <section class="photo-grid" id="photoGrid" aria-label="Photos"></section>
        <div class="sentinel" id="sentinel"></div>

        <div class="floating-action-bar">
            <div class="selection-meter" aria-live="polite">
                <div class="meter-info">
                    <span>Selected</span>
                    <strong><b id="selectedCount">0</b>/<b id="totalCount">0</b></strong>
                </div>
                <div class="meter-track"><i id="progressFill"></i></div>
            </div>
            <div class="export-actions">
                <button id="downloadJsonButton" type="button">Submit Selection</button>
                <button class="quiet-button" id="downloadTextButton" type="button">TXT</button>
                <button class="quiet-button" id="downloadCsvButton" type="button">CSV</button>
            </div>
        </div>
    </main>

    <section class="viewer" id="viewer" hidden aria-modal="true" role="dialog">
        <div class="viewer-top">
            <button class="viewer-icon" id="closeViewerButton" type="button" aria-label="Close">Close</button>
            <strong id="viewerTitle">Photo</strong>
            <button class="viewer-icon" id="zoomButton" type="button">Zoom</button>
        </div>
        <button class="nav-button previous" id="previousButton" type="button" aria-label="Previous photo">Prev</button>
        <img id="viewerImage" alt="">
        <button class="nav-button next" id="nextButton" type="button" aria-label="Next photo">Next</button>
        <div class="viewer-bottom">
            <button id="viewerSelectButton" type="button">Select</button>
            <span id="viewerPosition">1/1</span>
        </div>
    </section>
</body>

</html>
